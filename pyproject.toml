[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dopamine"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.2",
    "langchain-core>=0.2",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "langchain-anthropic>=0.3",
    "argon2-cffi>=25.1",
]

[project.scripts]
tokens = "src.cli.tokens:main"

[project.optional-dependencies]
openai = ["langchain-openai>=0.2"]
bedrock = ["langchain-aws>=0.2"]
all = ["langchain-openai>=0.2", "langchain-aws>=0.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".specify", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
